name: Release bundle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: release-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
      # Documentation-only pull requests change nothing in the bundle, so the job
      # reports without building. The job names are required status checks.
      - name: Classify change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          scope=code
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' || true)"
            scope="$(printf '%s\n' "${files}" | scripts/ci-change-scope.sh)"
          fi
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          echo "Change scope: ${scope}"
      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.scope == 'code'
      # The full test gate runs once, in the CI workflow's required "pnpm check" job.
      - name: Build immutable release
        if: steps.scope.outputs.scope == 'code'
        run: scripts/build-release.sh "${RUNNER_TEMP}/clawsweeper-release"
      - name: Read-only production-plan smoke
        if: steps.scope.outputs.scope == 'code'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${RUNNER_TEMP}/clawsweeper-release"
          node dist/clawsweeper.js plan \
            --target-repo "${GITHUB_REPOSITORY}" \
            --items-dir "${RUNNER_TEMP}/plan-smoke/items" \
            --batch-size 1 \
            --shard-count 1 \
            --max-pages 1 \
            --hot-intake > "${RUNNER_TEMP}/plan-smoke.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
            "${RUNNER_TEMP}/plan-smoke.json"
      - name: Reverify after smoke
        if: steps.scope.outputs.scope == 'code'
        run: "${RUNNER_TEMP}/clawsweeper-release/scripts/verify-release.sh ${RUNNER_TEMP}/clawsweeper-release"
      - name: Package immutable transport archive
        if: steps.scope.outputs.scope == 'code'
        run: |
          archive="clawsweeper-release-${GITHUB_SHA}.tgz"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/${archive}" \
            clawsweeper-release
          (
            cd "${RUNNER_TEMP}"
            sha256sum "${archive}" > "${archive}.sha256"
          )
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.scope == 'code'
        with:
          name: clawsweeper-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/clawsweeper-release-${{ github.sha }}.tgz
            ${{ runner.temp }}/clawsweeper-release-${{ github.sha }}.tgz.sha256
          if-no-files-found: error

  transport-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        if: needs.build.outputs.scope == 'code'
        with:
          name: clawsweeper-release-${{ github.sha }}
          path: ${{ runner.temp }}/transport
      - name: Verify transported archive and executable modes
        if: needs.build.outputs.scope == 'code'
        run: |
          cd "${RUNNER_TEMP}/transport"
          sha256sum --check "clawsweeper-release-${GITHUB_SHA}.tgz.sha256"
          install -d "${RUNNER_TEMP}/transported-release"
          tar -C "${RUNNER_TEMP}/transported-release" -xzf \
            "clawsweeper-release-${GITHUB_SHA}.tgz"
          release="${RUNNER_TEMP}/transported-release/clawsweeper-release"
          test -x "${release}/scripts/verify-release.sh"
          test -x "${release}/scripts/smoke-release.mjs"
          "${release}/scripts/verify-release.sh" "${release}"
