name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apply-report.json"
      - "repair-apply-report.json"
      - "jobs/**"
      - "records/**"
      - "results/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            config
            dashboard
            docs
            instructions
            prompts
            schema
            scripts
            src
            systemd
            test
            .oxfmtrc.json
            AGENTS.md
            README.md
            package.json
            pnpm-lock.yaml
            tsconfig.dashboard.json
            tsconfig.json
            tsconfig.repair.json
          sparse-checkout-cone-mode: false

      # A pull request that only touches documentation runs the documentation
      # check and finishes; everything else runs the full gate. The job name is a
      # required status check, so it must always report.
      - name: Classify change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          scope=code
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' || true)"
            scope="$(printf '%s\n' "${files}" | scripts/ci-change-scope.sh)"
          fi
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          echo "Change scope: ${scope}"

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.scope == 'docs'
        with:
          node-version: "24"

      - name: Run documentation check
        if: steps.scope.outputs.scope == 'docs'
        run: node scripts/check-active-surface.ts

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.scope == 'code'

      - uses: ./.github/actions/setup-promtool
        if: steps.scope.outputs.scope == 'code'

      - name: Run check
        if: steps.scope.outputs.scope == 'code'
        run: pnpm run check
